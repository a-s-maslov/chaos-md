global:
  scrape_interval: 5s
  scrape_timeout: 5s

scrape_configs:
  - job_name: workload
    scrape_interval: 1s
    scrape_timeout: 1s
    static_configs:
      - targets: [workshop-load:9091]
        labels:
          instance: workshop-load

  - job_name: ydb-partition-observer
    scrape_interval: 5s
    scrape_timeout: 3s
    static_configs:
      - targets: [workshop-observer:9092]
        labels:
          instance: workshop-observer

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          instance: podman-machine

  - job_name: ydb/ydb
    metrics_path: /counters/counters=ydb/name_label=name/prometheus
    metric_relabel_configs:
      - source_labels: [__name__]
        target_label: __name__
        replacement: ydb_$1
    static_configs:
      - targets: [host.containers.internal:8765]
        labels:
          instance: local-ydb
          container: ydb-dynamic
          database: /local

  - job_name: ydb/kqp
    metrics_path: /counters/counters=kqp/prometheus
    metric_relabel_configs:
      - source_labels: [__name__]
        target_label: __name__
