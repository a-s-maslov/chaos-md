services:
  vm:
    image: ${VICTORIA_DOCKER_IMAGE:-victoriametrics/victoria-metrics:v1.106.1}
    container_name: vm
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-metrics-data
      - -httpListenAddr=:8428
      - -retentionPeriod=${VM_RETENTION:-30d}
      - -search.latencyOffset=${VM_LATENCY_OFFSET:-0s}
      - -promscrape.config=/etc/victoriametrics/local-scrape.yml
    ports:
      - "127.0.0.1:${VM_PORT:-8428}:8428"
    volumes:
      - vm-data:/victoria-metrics-data
      - ./compose-promscrape.yml:/etc/victoriametrics/local-scrape.yml:ro
    extra_hosts:
      - "host.containers.internal:host-gateway"

  node-exporter:
    image: ${NODE_EXPORTER_DOCKER_IMAGE:-prom/node-exporter:v1.8.2}
    container_name: node-exporter
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_DOCKER_IMAGE:-grafana/grafana:11.3.0}
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - vm
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_HTTP_PORT: "3000"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./compose-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro

volumes:
  vm-data:
  grafana-data:

networks:
  default:
    name: chaos-monitoring
